<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#17261F" />
<title>Tidak ada koneksi — Kediaman</title>
<style>
  :root { --ink:#17261F; --muted:#5b6660; --bg:#ffffff; --card:#f4f5f3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1713; --card:#17221c; --ink:#f3f1ec; --muted:#a8b0ab; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--ink);
         font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:360px; text-align:center; }
  img { width:72px; height:72px; border-radius:18px; }
  h1 { font-size:1.35rem; margin:20px 0 8px; }
  p { color:var(--muted); line-height:1.55; margin:0 0 22px; }
  button { appearance:none; border:0; border-radius:14px; height:48px; padding:0 22px; font:inherit; font-weight:700;
           background:#17261F; color:#fff; cursor:pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" />
  <h1>Kamu sedang offline</h1>
  <p>Halaman ini belum tersimpan di perangkat. Sambungkan internet lalu coba lagi — halaman yang pernah dibuka tetap bisa dilihat tanpa koneksi.</p>
  <button type="button" onclick="location.reload()">Coba lagi</button>
</main>
<script>addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
