# Sekali saja: membuat kunci upload Android (upload-keystore.jks).
# 1. Isi dulu secret ANDROID_KEYSTORE_PASSWORD (minimal 12 karakter, simpan juga di password manager).
# 2. Jalankan workflow ini (Actions → Run workflow, atau push ke branch build/android-key), unduh artefak "android-upload-key" (berlaku 1 hari).
# 3. SIMPAN file .jks itu di tempat aman (Google Drive pribadi/password manager) — dipakai untuk semua update.
# 4. Salin isi upload-keystore.base64.txt ke secret ANDROID_KEYSTORE_BASE64, dan isi ANDROID_KEY_ALIAS = upload.
# 5. Hapus artefak dari halaman run setelah diunduh.
name: "Mobile · Buat kunci Android"

on:
  push:
    branches: ['build/android-key']   # push ke branch ini = buat kunci (sekali saja)
  workflow_dispatch:

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Buat keystore
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ ${#KS_PASS} -lt 12 ]; then echo "::error::Isi secret ANDROID_KEYSTORE_PASSWORD (min. 12 karakter) dulu."; exit 1; fi
          mkdir key
          keytool -genkeypair -v -keystore key/upload-keystore.jks -storetype JKS -alias upload \
            -keyalg RSA -keysize 4096 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Kediaman, O=Kediaman Corp, L=Jakarta, C=ID"
          base64 -w0 key/upload-keystore.jks > key/upload-keystore.base64.txt
          keytool -list -v -keystore key/upload-keystore.jks -storepass "$KS_PASS" | grep -E "SHA256|Alias"
      - uses: actions/upload-artifact@v4
        with:
          name: android-upload-key
          path: key/
          retention-days: 1
